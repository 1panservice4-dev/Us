<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>Among Us V3</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #111;
    color: white;
    font-family:
        Arial,
        "Noto Sans KR",
        sans-serif;
    overflow: hidden;
}

button,
input,
select {
    font: inherit;
}

button {
    border: 0;
    border-radius: 10px;
    padding: 12px 18px;
    cursor: pointer;
    font-weight: bold;
}

input,
select {
    padding: 12px;
    border-radius: 10px;
    border: 1px solid #555;
    background: #222;
    color: white;
}

.hidden {
    display: none !important;
}

/* =====================
   LOGIN
===================== */

#loginScreen {
    width: 100vw;
    height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    background:
        radial-gradient(
            circle at center,
            #263238,
            #080808 70%
        );
}

.loginBox {
    width: min(92vw, 420px);
    padding: 30px;

    background: #1c1c1c;
    border-radius: 20px;

    box-shadow:
        0 20px 60px rgba(0,0,0,.6);

    text-align: center;
}

.loginBox h1 {
    font-size: 42px;
    margin: 0 0 20px;
}

.loginBox input {
    width: 100%;
    margin: 6px 0;
}

.loginBox button {
    width: 100%;
    margin-top: 8px;
}

#createBtn {
    background: #43a047;
    color: white;
}

#joinBtn {
    background: #1e88e5;
    color: white;
}

/* =====================
   LOBBY
===================== */

#lobbyScreen {
    width: 100vw;
    height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;
}

.lobby {
    width: min(95vw, 700px);
    padding: 25px;

    background: #1b1b1b;
    border-radius: 20px;
}

.roomCode {
    text-align: center;
    font-size: 42px;
    letter-spacing: 8px;
    color: #ffd54f;
    margin: 10px 0 25px;
}

.players {
    display: grid;
    grid-template-columns:
        repeat(auto-fit, minmax(130px, 1fr));

    gap: 10px;
}

.playerCard {
    padding: 12px;
    border-radius: 12px;
    background: #292929;
    text-align: center;
}

.playerIcon {
    width: 40px;
    height: 40px;
    margin: auto auto 8px;

    border-radius: 50%;
}

.settings {
    margin-top: 20px;
    display: grid;
    gap: 8px;
}

#startBtn {
    width: 100%;
    margin-top: 20px;
    background: #e53935;
    color: white;
}

/* =====================
   GAME
===================== */

#gameScreen {
    width: 100vw;
    height: 100vh;
    position: relative;

    background: #101010;
}

#gameCanvas {
    position: absolute;
    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    width: min(100vw, 1000px);
    height: min(100vh, 700px);

    background: #263238;

    border: 3px solid #555;
}

#topUI {
    position: absolute;
    top: 10px;
    left: 10px;
    right: 10px;

    display: flex;
    justify-content: space-between;

    pointer-events: none;
}

.uiBox {
    background: rgba(0,0,0,.65);
    padding: 10px 14px;
    border-radius: 10px;
}

#roleText {
    font-weight: bold;
}

#taskBar {
    position: absolute;

    left: 50%;
    top: 15px;

    transform: translateX(-50%);

    width: min(300px, 50vw);
    height: 20px;

    border: 2px solid white;
    border-radius: 10px;

    overflow: hidden;

    background: #222;
}

#taskFill {
    height: 100%;
    width: 0%;

    background: #4caf50;
}

/* =====================
   CONTROLS
===================== */

#mobileControls {
    position: absolute;
    left: 20px;
    bottom: 20px;

    width: 160px;
    height: 160px;
}

.moveBtn {
    position: absolute;

    width: 55px;
    height: 55px;

    background: rgba(255,255,255,.25);
    color: white;

    border-radius: 50%;

    font-size: 22px;

    user-select: none;
    -webkit-user-select: none;
}

#upBtn {
    left: 52px;
    top: 0;
}

#downBtn {
    left: 52px;
    bottom: 0;
}

#leftBtn {
    left: 0;
    top: 52px;
}

#rightBtn {
    right: 0;
    top: 52px;
}

/* =====================
   ACTIONS
===================== */

#actions {
    position: absolute;
    right: 20px;
    bottom: 20px;

    display: flex;
    flex-direction: column;
    gap: 8px;
}

.actionBtn {
    width: 90px;
    height: 55px;

    background: #333;
    color: white;
}

#killBtn {
    background: #c62828;
}

#reportBtn {
    background: #f9a825;
}

#meetingBtn {
    background: #1565c0;
}

#taskBtn {
    background: #2e7d32;
}

/* =====================
   CHAT
===================== */

#chat {
    position: absolute;

    left: 10px;
    bottom: 10px;

    width: min(300px, 45vw);
}

#chatMessages {
    height: 130px;

    overflow-y: auto;

    padding: 8px;

    background: rgba(0,0,0,.55);

    border-radius: 10px;

    margin-bottom: 5px;

    font-size: 13px;
}

.chatInput {
    display: flex;
    gap: 5px;
}

.chatInput input {
    min-width: 0;
    flex: 1;
}

.chatInput button {
    padding: 8px 12px;
}

/* =====================
   MEETING
===================== */

#meetingScreen {
    position: absolute;

    inset: 0;

    background:
        rgba(10,10,10,.96);

    z-index: 100;

    display: flex;
    align-items: center;
    justify-content: center;
}

.meetingBox {
    width: min(95vw, 650px);
    max-height: 90vh;

    overflow-y: auto;

    background: #202020;
    border-radius: 20px;

    padding: 20px;
}

.meetingTitle {
    text-align: center;
    font-size: 30px;
    margin-bottom: 15px;
}

.voteGrid {
    display: grid;

    grid-template-columns:
        repeat(auto-fit, minmax(130px, 1fr));

    gap: 10px;
}

.voteBtn {
    background: #333;
    color: white;
}

.voteBtn.selected {
    outline: 4px solid #42a5f5;
}

#skipVote {
    width: 100%;
    margin-top: 10px;

    background: #555;
    color: white;
}

/* =====================
   TASK
===================== */

#taskPanel {
    position: absolute;

    inset: 0;

    z-index: 50;

    background: rgba(0,0,0,.8);

    display: flex;

    justify-content: center;
    align-items: center;
}

.taskBox {
    width: min(90vw, 450px);

    background: #222;

    padding: 25px;

    border-radius: 20px;

    text-align: center;
}

.taskButton {
    display: block;

    width: 100%;

    margin: 8px 0;

    background: #2e7d32;

    color: white;
}

/* =====================
   GAME OVER
===================== */

#gameOver {
    position: absolute;

    inset: 0;

    z-index: 200;

    background:
        rgba(0,0,0,.92);

    display: flex;

    justify-content: center;
    align-items: center;

    text-align: center;
}

.gameOverBox {
    padding: 40px;
}

.gameOverBox h1 {
    font-size: 48px;
}

#backLobbyBtn {
    background: #1976d2;
    color: white;
}

/* =====================
   MOBILE
===================== */

@media (min-width: 800px) {

    #mobileControls {
        opacity: .35;
    }
}

@media (max-width: 600px) {

    .loginBox h1 {
        font-size: 32px;
    }

    .roomCode {
        font-size: 30px;
    }

    #chat {
        width: 45vw;
    }

    #chatMessages {
        height: 90px;
    }

    .actionBtn {
        width: 75px;
        height: 48px;
    }
}

</style>
</head>

<body>

<!-- =====================
     LOGIN
===================== -->

<div id="loginScreen">

    <div class="loginBox">

        <h1>Among Us</h1>

        <input
            id="nameInput"
            maxlength="16"
            placeholder="닉네임">

        <button id="createBtn">
            방 만들기
        </button>

        <input
            id="roomInput"
            maxlength="6"
            inputmode="numeric"
            placeholder="6자리 방 코드">

        <button id="joinBtn">
            방 참가
        </button>

        <p id="connectionStatus">
            서버 연결 중...
        </p>

    </div>

</div>


<!-- =====================
     LOBBY
===================== -->

<div id="lobbyScreen" class="hidden">

    <div class="lobby">

        <h2>대기실</h2>

        <div class="roomCode" id="roomCode">
            ------
        </div>

        <div>
            친구에게 위의 방 코드를 알려주세요.
        </div>

        <h3>플레이어</h3>

        <div
            id="playerList"
            class="players">
        </div>

        <div class="settings">

            <label>
                임포스터 수
                <select id="impostorSetting">
                    <option value="1">1명</option>
                    <option value="2">2명</option>
                    <option value="3">3명</option>
                </select>
            </label>

            <label>
                킬 쿨다운
                <select id="cooldownSetting">
                    <option value="10">10초</option>
                    <option value="20">20초</option>
                    <option value="25" selected>25초</option>
                    <option value="30">30초</option>
                    <option value="45">45초</option>
                    <option value="60">60초</option>
                </select>
            </label>

            <label>
                회의 시간
                <select id="meetingSetting">
                    <option value="15">15초</option>
                    <option value="30" selected>30초</option>
                    <option value="45">45초</option>
                    <option value="60">60초</option>
                    <option value="90">90초</option>
                </select>
            </label>

        </div>

        <button id="startBtn">
            게임 시작
        </button>

    </div>

</div>


<!-- =====================
     GAME
===================== -->

<div id="gameScreen" class="hidden">

    <canvas
        id="gameCanvas"
        width="1000"
        height="700">
    </canvas>

    <div id="topUI">

        <div class="uiBox">
            <span id="roleText">
                시민
            </span>
        </div>

        <div class="uiBox">
            <span id="playerCount">
                0
            </span>
            명
        </div>

    </div>

    <div id="taskBar">
        <div id="taskFill"></div>
    </div>


    <!-- 모바일 이동 -->

    <div id="mobileControls">

        <button class="moveBtn" id="upBtn">
            ▲
        </button>

        <button class="moveBtn" id="downBtn">
            ▼
        </button>

        <button class="moveBtn" id="leftBtn">
            ◀
        </button>

        <button class="moveBtn" id="rightBtn">
            ▶
        </button>

    </div>


    <!-- 액션 -->

    <div id="actions">

        <button
            class="actionBtn"
            id="killBtn">
            KILL
        </button>

        <button
            class="actionBtn"
            id="reportBtn">
            REPORT
        </button>

        <button
            class="actionBtn"
            id="meetingBtn">
            MEETING
        </button>

        <button
            class="actionBtn"
            id="taskBtn">
            TASK
        </button>

    </div>


    <!-- 채팅 -->

    <div id="chat">

        <div id="chatMessages"></div>

        <div class="chatInput">

            <input
                id="chatInput"
                placeholder="채팅">

            <button id="chatSend">
                전송
            </button>

        </div>

    </div>


    <!-- 회의 -->

    <div id="meetingScreen" class="hidden">

        <div class="meetingBox">

            <div class="meetingTitle">
                회의
            </div>

            <div id="meetingTimer">
                30
            </div>

            <div
                id="voteGrid"
                class="voteGrid">
            </div>

            <button id="skipVote">
                건너뛰기
            </button>

        </div>

    </div>


    <!-- 미션 -->

    <div id="taskPanel" class="hidden">

        <div class="taskBox">

            <h2>
                미션
            </h2>

            <p>
                완료할 미션을 선택하세요.
            </p>

            <button
                class="taskButton"
                data-task="0">
                배선 고치기
            </button>

            <button
                class="taskButton"
                data-task="1">
                데이터 업로드
            </button>

            <button
                class="taskButton"
                data-task="2">
                엔진 점검
            </button>

            <button
                id="closeTask">
                닫기
            </button>

        </div>

    </div>


    <!-- 게임 종료 -->

    <div id="gameOver" class="hidden">

        <div class="gameOverBox">

            <h1 id="winnerText">
                시민 승리
            </h1>

            <div id="finalPlayers"></div>

            <button id="backLobbyBtn">
                대기실로
            </button>

        </div>

    </div>

</div>


<script>

const $ = id =>
    document.getElementById(id);


/* =====================
   SERVER
===================== */

const protocol =
    location.protocol === "https:"
        ? "wss:"
        : "ws:";

const socket =
    new WebSocket(
        `${protocol}//${location.host}`
    );


let myId = null;
let myRole = null;
let myColor = "#e53935";
let roomCode = null;
let hostId = null;

let players = [];

let gameStarted = false;

let selectedTarget = null;

let keys = {};

let lastMove = 0;

let meetingTimer = null;

let myTasks = [false, false, false];

let taskTotal = 0;
let taskDone = 0;


/* =====================
   CANVAS
===================== */

const canvas =
    $("gameCanvas");

const ctx =
    canvas.getContext("2d");


/* =====================
   SOCKET
===================== */

function send(type, data = {}) {

    if (
        socket.readyState !==
        WebSocket.OPEN
    ) return;

    socket.send(
        JSON.stringify({
            type,
            ...data
        })
    );
}


socket.addEventListener(
    "open",
    () => {

        $("connectionStatus")
            .textContent =
            "서버 연결됨";

    }
);


socket.addEventListener(
    "close",
    () => {

        $("connectionStatus")
            .textContent =
            "서버 연결 끊김";

    }
);


socket.addEventListener(
    "message",
    event => {

        let msg;

        try {
            msg = JSON.parse(
                event.data
            );
        } catch {
            return;
        }

        handleServerMessage(msg);
    }
);


/* =====================
   SERVER MESSAGES
===================== */

function handleServerMessage(msg) {

    switch (msg.type) {

        case "error":

            alert(msg.message);

            break;


        case "room_created":

            roomCode =
                msg.code;

            myId =
                msg.playerId;

            myColor =
                msg.color;

            hostId =
                myId;

            showLobby(
                msg.settings
            );

            break;


        case "joined":

            roomCode =
                msg.code;

            myId =
                msg.playerId;

            myColor =
                msg.color;

            showLobby(
                msg.settings
            );

            break;


        case "lobby":

            roomCode =
                msg.code;

            hostId =
                msg.hostId;

            players =
                msg.players || [];

            updateLobby(
                msg.settings
            );

            break;


        case "settings":

            updateLobby(
                msg.settings
            );

            break;


        case "game_started":

            startLocalGame(
                msg
            );

            break;


        case "positions":

            for (
                const p
                of msg.players
            ) {

                const local =
                    players.find(
                        x => x.id === p.id
                    );

                if (local) {

                    local.x = p.x;
                    local.y = p.y;
                    local.alive = p.alive;

                }
            }

            break;


        case "player_killed":

            for (
                const p
                of players
            ) {

                if (
                    p.id ===
                    msg.targetId
                ) {
                    p.alive = false;
                }
            }

            break;


        case "meeting_started":

            openMeeting(
                msg
            );

            break;


        case "vote_registered":

            break;


        case "meeting_result":

            closeMeeting();

            if (
                msg.ejected
            ) {

                const p =
                    players.find(
                        x =>
                            x.id ===
                            msg.ejected.id
                    );

                if (p) {
                    p.alive = false;
                }

                addChat(
                    "SYSTEM",
                    `${msg.ejected.name} 님이 퇴출되었습니다.`
                );
            }

            break;


        case "task_done":

            myTasks[
                msg.index
            ] = true;

            taskDone =
                msg.completed;

            taskTotal =
                msg.total;

            updateTaskBar();

            break;


        case "task_progress":

            taskDone =
                msg.done;

            taskTotal =
                msg.total;

            updateTaskBar();

            break;


        case "chat":

            addChat(
                msg.player,
                msg.text,
                msg.color
            );

            break;


        case "game_over":

            showGameOver(
                msg
            );

            break;

    }
}


/* =====================
   LOGIN
===================== */

$("createBtn")
    .onclick = () => {

        const name =
            $("nameInput")
                .value
                .trim();

        if (!name) {

            alert(
                "닉네임을 입력하세요."
            );

            return;
        }

        send(
            "create",
            { name }
        );
    };


$("joinBtn")
    .onclick = () => {

        const name =
            $("nameInput")
                .value
                .trim();

        const code =
            $("roomInput")
                .value
                .trim();

        if (!name) {

            alert(
                "닉네임을 입력하세요."
            );

            return;
        }

        if (!/^\d{6}$/.test(code)) {

            alert(
                "6자리 방 코드를 입력하세요."
            );

            return;
        }

        send(
            "join",
            {
                name,
                code
            }
        );
    };


/* =====================
   LOBBY
===================== */

function showLobby(settings) {

    $("loginScreen")
        .classList.add("hidden");

    $("lobbyScreen")
        .classList.remove("hidden");

    $("gameScreen")
        .classList.add("hidden");

    $("roomCode")
        .textContent =
        roomCode;

    updateLobby(
        settings
    );
}


function updateLobby(settings) {

    if (!settings) return;

    $("roomCode")
        .textContent =
        roomCode || "------";

    const list =
        $("playerList");

    list.innerHTML = "";

    for (
        const p
        of players
    ) {

        const div =
            document.createElement(
                "div"
            );

        div.className =
            "playerCard";

        div.innerHTML = `
            <div
                class="playerIcon"
                style="background:${p.color}">
            </div>

            <b>${escapeHtml(p.name)}</b>

            ${
                p.id === hostId
                    ? "<br>👑 방장"
                    : ""
            }
        `;

        list.appendChild(div);
    }


    $("impostorSetting")
        .value =
        settings.impostors;


    $("cooldownSetting")
        .value =
        settings.killCooldown;


    $("meetingSetting")
        .value =
        settings.meetingTime;


    const isHost =
        myId === hostId;

    $("startBtn")
        .style.display =
        isHost
            ? "block"
            : "none";


    $("impostorSetting")
        .disabled =
        !isHost;

    $("cooldownSetting")
        .disabled =
        !isHost;

    $("meetingSetting")
        .disabled =
        !isHost;
}


/* =====================
   SETTINGS
===================== */

function updateSettings() {

    if (
        myId !== hostId
    ) return;

    send(
        "settings",
        {
            impostors:
                Number(
                    $("impostorSetting")
                        .value
                ),

            killCooldown:
                Number(
                    $("cooldownSetting")
                        .value
                ),

            meetingTime:
                Number(
                    $("meetingSetting")
                        .value
                )
        }
    );
}


$("impostorSetting")
    .onchange =
    updateSettings;

$("cooldownSetting")
    .onchange =
    updateSettings;

$("meetingSetting")
    .onchange =
    updateSettings;


$("startBtn")
    .onclick = () => {

        send("start");

    };


/* =====================
   START GAME
===================== */

function startLocalGame(msg) {

    $("lobbyScreen")
        .classList.add("hidden");

    $("gameScreen")
        .classList.remove("hidden");

    gameStarted = true;

    myRole =
        msg.self.role;

    myColor =
        msg.self.color;

    players =
        msg.players || [];

    myTasks =
        [false, false, false];

    taskTotal =
        players.filter(
            p => p.role === "crew"
        ).length * 3;

    taskDone = 0;

    $("roleText")
        .textContent =
        myRole === "impostor"
            ? "🔴 임포스터"
            : "🔵 시민";

    $("roleText")
        .style.color =
        myRole === "impostor"
            ? "#ef5350"
            : "#42a5f5";

    updateTaskBar();

    requestAnimationFrame(
        gameLoop
    );
}


/* =====================
   GAME LOOP
===================== */

function gameLoop(time) {

    if (!gameStarted)
        return;

    moveLocalPlayer(
        time
    );

    drawGame();

    requestAnimationFrame(
        gameLoop
    );
}


/* =====================
   MOVEMENT
===================== */

window.addEventListener(
    "keydown",
    e => {

        keys[
            e.key.toLowerCase()
        ] = true;

    }
);


window.addEventListener(
    "keyup",
    e => {

        keys[
            e.key.toLowerCase()
        ] = false;

    }
);


function getMe() {

    return players.find(
        p => p.id === myId
    );
}


function moveLocalPlayer(time) {

    const me =
        getMe();

    if (!me || !me.alive)
        return;

    let dx = 0;
    let dy = 0;

    if (
        keys["w"] ||
        keys["arrowup"]
    ) dy -= 1;

    if (
        keys["s"] ||
        keys["arrowdown"]
    ) dy += 1;

    if (
        keys["a"] ||
        keys["arrowleft"]
    ) dx -= 1;

    if (
        keys["d"] ||
        keys["arrowright"]
    ) dx += 1;

    if (!dx && !dy)
        return;

    const length =
        Math.sqrt(
            dx * dx +
            dy * dy
        );

    dx /= length;
    dy /= length;

    const speed = 3;

    me.x +=
        dx * speed;

    me.y +=
        dy * speed;

    me.x =
        Math.max(
            40,
            Math.min(
                960,
                me.x
            )
        );

    me.y =
        Math.max(
            40,
            Math.min(
                650,
                me.y
            )
        );

    if (
        time - lastMove >
        40
    ) {

        send(
            "move",
            {
                x: me.x,
                y: me.y
            }
        );

        lastMove =
            time;
    }
}


/* =====================
   MOBILE BUTTONS
===================== */

function holdKey(
    key,
    button
) {

    const start = e => {

        e.preventDefault();

        keys[key] = true;
    };

    const end = e => {

        e.preventDefault();

        keys[key] = false;
    };

    button.addEventListener(
        "pointerdown",
        start
    );

    button.addEventListener(
        "pointerup",
        end
    );

    button.addEventListener(
        "pointercancel",
        end
    );

    button.addEventListener(
        "pointerleave",
        end
    );
}


holdKey(
    "w",
    $("upBtn")
);

holdKey(
    "s",
    $("downBtn")
);

holdKey(
    "a",
    $("leftBtn")
);

holdKey(
    "d",
    $("rightBtn")
);


/* =====================
   DRAW GAME
===================== */

function drawGame() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    // 바닥

    ctx.fillStyle =
        "#37474f";

    ctx.fillRect(
        0,
        0,
        1000,
        700
    );


    // 방

    drawRoom(
        60,
        70,
        260,
        200,
        "CAFETERIA"
    );

    drawRoom(
        360,
        70,
        260,
        200,
        "ENGINE"
    );

    drawRoom(
        680,
        70,
        260,
        200,
        "LAB"
    );

    drawRoom(
        60,
        380,
        260,
        220,
        "STORAGE"
    );

    drawRoom(
        360,
        380,
        260,
        220,
        "MEDBAY"
    );

    drawRoom(
        680,
        380,
        260,
        220,
        "SECURITY"
    );


    // 통로

    ctx.fillStyle =
        "#546e7a";

    ctx.fillRect(
        320,
        145,
        40,
        60
    );

    ctx.fillRect(
        620,
        145,
        60,
        60
    );

    ctx.fillRect(
        320,
        460,
        40,
        60
    );

    ctx.fillRect(
        620,
        460,
        60,
        60
    );


    // 플레이어

    for (
        const p
        of players
    ) {

        drawPlayer(
            p
        );

    }


    $("playerCount")
        .textContent =
        players.length;
}


function drawRoom(
    x,
    y,
    w,
    h,
    name
) {

    ctx.fillStyle =
        "#455a64";

    ctx.fillRect(
        x,
        y,
        w,
        h
    );

    ctx.strokeStyle =
        "#90a4ae";

    ctx.lineWidth = 4;

    ctx.strokeRect(
        x,
        y,
        w,
        h
    );

    ctx.fillStyle =
        "#cfd8dc";

    ctx.font =
        "bold 16px Arial";

    ctx.textAlign =
        "center";

    ctx.fillText(
        name,
        x + w / 2,
        y + 25
    );
}


function drawPlayer(p) {

    if (
        !p.alive &&
        p.id !== myId
    ) {

        return;
    }

    let color =
        p.color;

    if (
        p.id === myId &&
        !p.alive
    ) {

        color =
            "rgba(255,255,255,.45)";
    }

    ctx.save();

    ctx.translate(
        p.x,
        p.y
    );


    // 몸

    ctx.fillStyle =
        color;

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        18,
        0,
        Math.PI * 2
    );

    ctx.fill();


    // 바이저

    ctx.fillStyle =
        "#b3e5fc";

    ctx.beginPath();

    ctx.ellipse(
        7,
        -5,
        10,
        7,
        0,
        0,
        Math.PI * 2
    );

    ctx.fill();


    // 이름

    ctx.fillStyle =
        "white";

    ctx.font =
        "12px Arial";

    ctx.textAlign =
        "center";

    ctx.fillText(
        p.name,
        0,
        34
    );


    if (
        p.id === myId
    ) {

        ctx.strokeStyle =
            "white";

        ctx.lineWidth =
            2;

        ctx.beginPath();

        ctx.arc(
            0,
            0,
            23,
            0,
            Math.PI * 2
        );

        ctx.stroke();
    }

    ctx.restore();
}


/* =====================
   TARGET SELECTION
===================== */

canvas.addEventListener(
    "pointerdown",
    e => {

        if (!gameStarted)
            return;

        const rect =
            canvas.getBoundingClientRect();

        const scaleX =
            canvas.width /
            rect.width;

        const scaleY =
            canvas.height /
            rect.height;

        const x =
            (e.clientX -
                rect.left) *
            scaleX;

        const y =
            (e.clientY -
                rect.top) *
            scaleY;

        selectedTarget =
            null;

        let closest =
            null;

        let distance =
            Infinity;

        for (
            const p
            of players
        ) {

            if (
                p.id === myId ||
                !p.alive
            ) continue;

            const dx =
                x - p.x;

            const dy =
                y - p.y;

            const d =
                Math.sqrt(
                    dx * dx +
                    dy * dy
                );

            if (
                d < 35 &&
                d < distance
            ) {

                closest =
                    p;

                distance =
                    d;
            }
        }

        selectedTarget =
            closest;

    }
);


/* =====================
   KILL
===================== */

$("killBtn")
    .onclick = () => {

        if (
            myRole !==
            "impostor"
        ) return;

        if (!selectedTarget) {

            alert(
                "죽일 플레이어를 선택하세요."
            );

            return;
        }

        send(
            "kill",
            {
                targetId:
                    selectedTarget.id
            }
        );

        selectedTarget =
            null;
    };


/* =====================
   REPORT
===================== */

$("reportBtn")
    .onclick = () => {

        send("report");

    };


/* =====================
   MEETING
===================== */

$("meetingBtn")
    .onclick = () => {

        send("emergency");

    };


function openMeeting(msg) {

    $("meetingScreen")
        .classList.remove("hidden");

    const grid =
        $("voteGrid");

    grid.innerHTML = "";

    for (
        const p
        of players
    ) {

        if (!p.alive)
            continue;

        const button =
            document.createElement(
                "button"
            );

        button.className =
            "voteBtn";

        button.textContent =
            p.name;

        button.onclick = () => {

            send(
                "vote",
                {
                    target:
                        p.id
                }
            );

            button.classList.add(
                "selected"
            );
        };

        grid.appendChild(
            button
        );
    }


    $("meetingTimer")
        .textContent =
        msg.time;


    let time =
        msg.time;

    clearInterval(
        meetingTimer
    );

    meetingTimer =
        setInterval(
            () => {

                time--;

                $("meetingTimer")
                    .textContent =
                    Math.max(
                        0,
                        time
                    );

                if (time <= 0) {

                    clearInterval(
                        meetingTimer
                    );
                }

            },
            1000
        );
}


$("skipVote")
    .onclick = () => {

        send(
            "vote",
            {
                target:
                    "skip"
            }
        );
    };


function closeMeeting() {

    clearInterval(
        meetingTimer
    );

    $("meetingScreen")
        .classList.add("hidden");
}


/* =====================
   TASKS
===================== */

$("taskBtn")
    .onclick = () => {

        const me =
            getMe();

        if (!me || !me.alive)
            return;

        if (
            myRole ===
            "impostor"
        ) {

            alert(
                "임포스터는 미션을 수행할 수 없습니다."
            );

            return;
        }

        $("taskPanel")
            .classList.remove(
                "hidden"
            );

        updateTaskButtons();
    };


$("closeTask")
    .onclick = () => {

        $("taskPanel")
            .classList.add(
                "hidden"
            );
    };


document.querySelectorAll(
    ".taskButton"
).forEach(
    button => {

        button.onclick = () => {

            const index =
                Number(
                    button.dataset.task
                );

            if (
                myTasks[index]
            ) {

                alert(
                    "이미 완료한 미션입니다."
                );

                return;
            }

            send(
                "task",
                {
                    index
                }
            );

            $("taskPanel")
                .classList.add(
                    "hidden"
                );
        };
    }
);


function updateTaskButtons() {

    document.querySelectorAll(
        ".taskButton"
    ).forEach(
        button => {

            const index =
                Number(
                    button.dataset.task
                );

            if (
                myTasks[index]
            ) {

                button.textContent =
                    "✓ 완료";

                button.disabled =
                    true;

            } else {

                button.disabled =
                    false;
            }
        }
    );
}


function updateTaskBar() {

    if (
        taskTotal <= 0
    ) {

        $("taskFill")
            .style.width =
            "0%";

        return;
    }

    const percent =
        Math.min(
            100,
            (taskDone /
                taskTotal) *
            100
        );

    $("taskFill")
        .style.width =
        percent + "%";
}


/* =====================
   CHAT
===================== */

$("chatSend")
    .onclick =
    sendChat;


$("chatInput")
    .addEventListener(
        "keydown",
        e => {

            if (
                e.key ===
                "Enter"
            ) {

                sendChat();

            }
        }
    );


function sendChat() {

    const input =
        $("chatInput");

    const text =
        input.value.trim();

    if (!text)
        return;

    send(
        "chat",
        { text }
    );

    input.value = "";
}


function addChat(
    name,
    text,
    color = "white"
) {

    const div =
        document.createElement(
            "div"
        );

    div.innerHTML = `
        <b style="color:${color}">
            ${escapeHtml(name)}
        </b>:
        ${escapeHtml(text)}
    `;

    $("chatMessages")
        .appendChild(div);

    $("chatMessages")
        .scrollTop =
        $("chatMessages")
            .scrollHeight;
}


/* =====================
   GAME OVER
===================== */

function showGameOver(msg) {

    gameStarted =
        false;

    $("gameOver")
        .classList.remove(
            "hidden"
        );

    if (
        msg.winner ===
        "crew"
    ) {

        $("winnerText")
            .textContent =
            "🔵 시민 승리";

    } else {

        $("winnerText")
            .textContent =
            "🔴 임포스터 승리";
    }


    const list =
        $("finalPlayers");

    list.innerHTML = "";

    for (
        const p
        of msg.players
    ) {

        const div =
            document.createElement(
                "div"
            );

        div.style.margin =
            "8px";

        div.innerHTML = `
            ${escapeHtml(p.name)}
            -
            ${
                p.role === "impostor"
                    ? "🔴 임포스터"
                    : "🔵 시민"
            }
            ${
                p.alive
                    ? ""
                    : " 💀"
            }
        `;

        list.appendChild(
            div
        );
    }
}


$("backLobbyBtn")
    .onclick = () => {

        location.reload();

    };


/* =====================
   UTILITY
===================== */

function escapeHtml(str) {

    return String(str)
        .replaceAll(
            "&",
            "&amp;"
        )
        .replaceAll(
            "<",
            "&lt;"
        )
        .replaceAll(
            ">",
            "&gt;"
        )
        .replaceAll(
            '"',
            "&quot;"
        )
        .replaceAll(
            "'",
            "&#039;"
        );
}


/* =====================
   INITIAL UI
===================== */

$("killBtn")
    .style.display =
    "none";


setInterval(
    () => {

        if (
            myRole ===
            "impostor" &&
            gameStarted
        ) {

            $("killBtn")
                .style.display =
                "block";

        } else {

            $("killBtn")
                .style.display =
                "none";
        }

    },
    200
);

</script>
