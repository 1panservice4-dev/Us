<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

<script>

/* =========================================================
   기본 변수
========================================================= */

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let W = window.innerWidth;
let H = window.innerHeight;

canvas.width = W;
canvas.height = H;

window.addEventListener("resize", () => {
    W = window.innerWidth;
    H = window.innerHeight;

    canvas.width = W;
    canvas.height = H;
});

const COLORS = [
    "#e74c3c",
    "#3498db",
    "#2ecc71",
    "#f1c40f",
    "#9b59b6",
    "#e67e22",
    "#1abc9c",
    "#ecf0f1"
];

let peer = null;
let host = false;

let myId = "";
let myName = "";

let roomCode = "";

let connections = {};

let players = {};

let myRole = "crew";

let gameStarted = false;
let meetingActive = false;

let tasksDone = 0;
let tasksTotal = 3;

let bodies = [];

let keys = {};

let lastNetworkUpdate = 0;


/* =========================================================
   플레이어 구조
========================================================= */

function createPlayer(id, name, color) {

    return {
        id: id,
        name: name,
        x: 0,
        y: 0,
        color: color || COLORS[Math.floor(Math.random() * COLORS.length)],

        alive: true,

        role: "crew",

        tasks: 0,

        kills: 0
    };
}


/* =========================================================
   방 만들기
========================================================= */

function createRoom() {

    myName =
        document.getElementById("nameInput").value.trim();

    if (!myName) {
        alert("닉네임을 입력하세요.");
        return;
    }

    host = true;

    peer = new Peer({
        debug: 1
    });

    peer.on("open", id => {

        myId = id;

        roomCode = id;

        startGame();

        addPlayer(
            createPlayer(
                myId,
                myName
            )
        );

        players[myId].role = "imposter";

        myRole = "imposter";

        updateRoleUI();

        addMessage(
            "SYSTEM",
            "방이 생성되었습니다."
        );
    });

    peer.on("connection", conn => {

        setupConnection(conn);

    });

    peer.on("error", err => {

        console.log(err);

        alert(
            "연결 오류: " + err.type
        );
    });
}


/* =========================================================
   방 참가
========================================================= */

function joinRoom() {

    myName =
        document.getElementById("nameInput").value.trim();

    const target =
        document.getElementById("roomInput").value.trim();

    if (!myName) {
        alert("닉네임을 입력하세요.");
        return;
    }

    if (!target) {
        alert("방 코드를 입력하세요.");
        return;
    }

    host = false;

    peer = new Peer({
        debug: 1
    });

    peer.on("open", id => {

        myId = id;

        roomCode = target;

        const conn =
            peer.connect(target);

        setupConnection(conn);
    });

    peer.on("error", err => {

        console.log(err);

        alert(
            "방에 연결할 수 없습니다."
        );
    });
}


/* =========================================================
   연결 설정
========================================================= */

function setupConnection(conn) {

    connections[conn.peer] = conn;

    conn.on("open", () => {

        conn.send({
            type: "hello",
            player: createPlayer(
                myId,
                myName
            )
        });

        if (!gameStarted) {
            startGame();
        }

        if (host) {

            Object.values(players).forEach(p => {

                conn.send({
                    type: "player",
                    player: p
                });

            });

        }
    });

    conn.on("data", data => {

        handleData(conn, data);

    });

    conn.on("close", () => {

        const id = conn.peer;

        delete connections[id];

        if (players[id]) {

            addMessage(
                "SYSTEM",
                players[id].name +
                " 님이 나갔습니다."
            );

            delete players[id];
        }
    });
}


/* =========================================================
   데이터 처리
========================================================= */

function handleData(conn, data) {

    if (!data || !data.type) return;

    switch (data.type) {

        case "hello":

            if (host) {

                addPlayer(data.player);

                broadcast({
                    type: "player",
                    player: data.player
                });

                broadcastPlayers();
            }

            break;


        case "player":

            addPlayer(data.player);

            break;


        case "players":

            data.players.forEach(p => {

                players[p.id] = p;

            });

            break;


        case "move":

            if (host && players[data.id]) {

                players[data.id].x = data.x;
                players[data.id].y = data.y;

                broadcast({
                    type: "move",
                    id: data.id,
                    x: data.x,
                    y: data.y
                }, conn.peer);

            }

            break;


        case "chat":

            addMessage(
                data.name,
                data.message
            );

            broadcast(
                data,
                conn.peer
            );

            break;


        case "kill":

            if (host) {

                processKill(
                    data.killer,
                    data.target
                );

            }

            break;


        case "report":

            if (host) {

                startMeeting(
                    data.reporter,
                    "시체가 발견되었습니다!"
                );

            }

            break;


        case "meeting":

            startMeeting(
                data.reporter,
                data.reason
            );

            break;


        case "vote":

            if (host) {

                processVote(
                    data.voter,
                    data.target
                );

            }

            break;


        case "voteResult":

            showVoteResult(
                data.target,
                data.votes
            );

            break;


        case "gameOver":

            showGameOver(
                data.impostersWin
            );

            break;
    }
}


/* =========================================================
   플레이어 추가
========================================================= */

function addPlayer(player) {

    if (!player) return;

    if (!player.color) {
        player.color =
            COLORS[
                Object.keys(players).length %
                COLORS.length
            ];
    }

    players[player.id] = player;

    addMessage(
        "SYSTEM",
        player.name + " 참가"
    );
}


/* =========================================================
   게임 시작
========================================================= */

function startGame() {

    document.getElementById("menu").style.display =
        "none";

    document.getElementById("game").style.display =
        "block";

    gameStarted = true;

    document.getElementById("roomCodeText").innerText =
        roomCode.substring(0, 8);

    setupControls();

    requestAnimationFrame(loop);
}


/* =========================================================
   역할 UI
========================================================= */

function updateRoleUI() {

    const el =
        document.getElementById("roleText");

    if (myRole === "imposter") {

        el.innerText =
            "🔴 임포스터";

        el.style.color =
            "#ff4444";

        document.getElementById(
            "killButton"
        ).style.display = "block";

    } else {

        el.innerText =
            "🔵 크루원";

        el.style.color =
            "#4fc3ff";

        document.getElementById(
            "killButton"
        ).style.display = "none";
    }
}


/* =========================================================
   이동
========================================================= */

function setupControls() {

    window.addEventListener(
        "keydown",
        e => {

            keys[e.key.toLowerCase()] = true;

        }
    );

    window.addEventListener(
        "keyup",
        e => {

            keys[e.key.toLowerCase()] = false;

        }
    );


    function hold(btn, key) {

        const element =
            document.getElementById(btn);

        element.addEventListener(
            "pointerdown",
            e => {

                e.preventDefault();

                keys[key] = true;

            }
        );

        element.addEventListener(
            "pointerup",
            e => {

                e.preventDefault();

                keys[key] = false;

            }
        );

        element.addEventListener(
            "pointerleave",
            () => {

                keys[key] = false;

            }
        );
    }

    hold("up", "w");
    hold("down", "s");
    hold("left", "a");
    hold("right", "d");
}


/* =========================================================
   이동 업데이트
========================================================= */

function updateMovement() {

    const me = players[myId];

    if (!me || !me.alive || meetingActive) {
        return;
    }

    const speed = 3;

    if (
        keys["w"] ||
        keys["arrowup"]
    ) {
        me.y -= speed;
    }

    if (
        keys["s"] ||
        keys["arrowdown"]
    ) {
        me.y += speed;
    }

    if (
        keys["a"] ||
        keys["arrowleft"]
    ) {
        me.x -= speed;
    }

    if (
        keys["d"] ||
        keys["arrowright"]
    ) {
        me.x += speed;
    }

    me.x =
        Math.max(
            -700,
            Math.min(700, me.x)
        );

    me.y =
        Math.max(
            -400,
            Math.min(400, me.y)
        );


    if (
        performance.now() -
        lastNetworkUpdate >
        50
    ) {

        lastNetworkUpdate =
            performance.now();

        if (host) {

            broadcast({
                type: "move",
                id: myId,
                x: me.x,
                y: me.y
            });

        } else {

            sendToHost({
                type: "move",
                id: myId,
                x: me.x,
                y: me.y
            });
        }
    }
}


/* =========================================================
   그리기
========================================================= */

function loop() {

    updateMovement();

    draw();

    requestAnimationFrame(loop);
}


function draw() {

    ctx.clearRect(
        0,
        0,
        W,
        H
    );

    const me = players[myId];

    if (!me) return;

    const cameraX =
        me.x;

    const cameraY =
        me.y;


    /*
       우주선 배경
    */

    ctx.fillStyle =
        "#171b22";

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    /*
       바닥
    */

    ctx.save();

    ctx.translate(
        W / 2 - cameraX,
        H / 2 - cameraY
    );

    ctx.fillStyle =
        "#242a33";

    ctx.fillRect(
        -850,
        -550,
        1700,
        1100
    );


    /*
       방
    */

    drawRoom(
        -500,
        -300,
        350,
        220,
        "CAFETERIA"
    );

    drawRoom(
        150,
        -300,
        400,
        220,
        "ENGINE"
    );

    drawRoom(
        -500,
        80,
        350,
        230,
        "MEDBAY"
    );

    drawRoom(
        150,
        80,
        400,
        230,
        "REACTOR"
    );


    /*
       통로
    */

    ctx.strokeStyle =
        "#555d69";

    ctx.lineWidth = 45;

    ctx.beginPath();

    ctx.moveTo(
        -150,
        -190
    );

    ctx.lineTo(
        150,
        -190
    );

    ctx.moveTo(
        -150,
        190
    );

    ctx.lineTo(
        150,
        190
    );

    ctx.stroke();


    /*
       미션 위치
    */

    drawTask(-300, -200);
    drawTask(330, -200);
    drawTask(-300, 190);


    /*
       시체
    */

    bodies.forEach(body => {

        ctx.fillStyle =
            "#9b59b6";

        ctx.beginPath();

        ctx.arc(
            body.x,
            body.y,
            15,
            0,
            Math.PI * 2
        );

        ctx.fill();

        ctx.fillStyle =
            "white";

        ctx.font =
            "12px Arial";

        ctx.textAlign =
            "center";

        ctx.fillText(
            "☠",
            body.x,
            body.y + 5
        );
    });


    /*
       플레이어
    */

    Object.values(players).forEach(p => {

        if (!p.alive) return;

        drawPlayer(p);

    });

    ctx.restore();
}


function drawRoom(x, y, w, h, name) {

    ctx.fillStyle =
        "#303742";

    ctx.fillRect(
        x,
        y,
        w,
        h
    );

    ctx.strokeStyle =
        "#707985";

    ctx.lineWidth = 5;

    ctx.strokeRect(
        x,
        y,
        w,
        h
    );

    ctx.fillStyle =
        "#9aa3ae";

    ctx.font =
        "18px Arial";

    ctx.textAlign =
        "center";

    ctx.fillText(
        name,
        x + w / 2,
        y + 30
    );
}


function drawTask(x, y) {

    ctx.fillStyle =
        "#f1c40f";

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        12,
        0,
        Math.PI * 2
    );

    ctx.fill();

    ctx.fillStyle =
        "black";

    ctx.font =
        "12px Arial";

    ctx.textAlign =
        "center";

    ctx.fillText(
        "⚙",
        x,
        y + 4
    );
}


function drawPlayer(p) {

    /*
       몸
    */

    ctx.fillStyle =
        p.color;

    ctx.beginPath();

    ctx.arc(
        p.x,
        p.y,
        20,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /*
       바이저
    */

    ctx.fillStyle =
        "#9be7ff";

    ctx.beginPath();

    ctx.ellipse(
        p.x + 6,
        p.y - 4,
        11,
        7,
        0,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /*
       이름
    */

    ctx.fillStyle =
        "white";

    ctx.font =
        "13px Arial";

    ctx.textAlign =
        "center";

    ctx.fillText(
        p.name,
        p.x,
        p.y - 28
    );


    if (p.id === myId) {

        ctx.strokeStyle =
            "white";

        ctx.lineWidth = 2;

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            25,
            0,
            Math.PI * 2
        );

        ctx.stroke();
    }
}


/* =========================================================
   킬
========================================================= */

function killNearest() {

    if (
        myRole !== "imposter" ||
        !players[myId] ||
        !players[myId].alive
    ) return;

    let nearest = null;

    let distance = Infinity;

    Object.values(players).forEach(p => {

        if (
            p.id === myId ||
            !p.alive
        ) return;

        const d =
            Math.hypot(
                p.x - players[myId].x,
                p.y - players[myId].y
            );

        if (
            d < distance &&
            d < 80
        ) {

            distance = d;

            nearest = p;
        }
    });


    if (!nearest) {

        addMessage(
            "SYSTEM",
            "가까운 플레이어가 없습니다."
        );

        return;
    }


    if (host) {

        processKill(
            myId,
            nearest.id
        );

    } else {

        sendToHost({
            type: "kill",
            killer: myId,
            target: nearest.id
        });
    }
}


function processKill(killer, target) {

    const k =
        players[killer];

    const victim =
        players[target];

    if (
        !k ||
        !victim ||
        !victim.alive ||
        k.role !== "imposter"
    ) return;


    const distance =
        Math.hypot(
            k.x - victim.x,
            k.y - victim.y
        );

    if (distance > 100) return;


    victim.alive = false;

    victim.x = victim.x;
    victim.y = victim.y;

    bodies.push({
        x: victim.x,
        y: victim.y,
        playerId: victim.id
    });

    k.kills++;

    broadcast({
        type: "player",
        player: victim
    });

    broadcast({
        type: "move",
        id: victim.id,
        x: victim.x,
        y: victim.y
    });

    addMessage(
        "SYSTEM",
        victim.name +
        " 님이 사망했습니다."
    );

    checkWin();
}


/* =========================================================
   시체 신고
========================================================= */

function reportBody() {

    const me =
        players[myId];

    if (!me || !me.alive) return;

    let found = null;

    for (const body of bodies) {

        const d =
            Math.hypot(
                body.x - me.x,
                body.y - me.y
            );

        if (d < 80) {

            found = body;

            break;
        }
    }

    if (!found) {

        addMessage(
            "SYSTEM",
            "근처에 시체가 없습니다."
        );

        return;
    }

    if (host) {

        startMeeting(
            myId,
            "시체가 발견되었습니다!"
        );

    } else {

        sendToHost({
            type: "report",
            reporter: myId
        });
    }
}


/* =========================================================
   긴급회의
========================================================= */

function callMeeting() {

    if (!players[myId]?.alive) return;

    if (host) {

        startMeeting(
            myId,
            "긴급회의가 호출되었습니다."
        );

    } else {

        sendToHost({
            type: "meeting",
            reporter: myId,
            reason: "긴급회의가 호출되었습니다."
        });
    }
}


/* =========================================================
   회의 시작
========================================================= */

function startMeeting(reporter, reason) {

    meetingActive = true;

    document.getElementById(
        "meeting"
    ).style.display = "block";

    document.getElementById(
        "meetingReason"
    ).innerText = reason;

    const list =
        document.getElementById("voteList");

    list.innerHTML = "";

    Object.values(players).forEach(p => {

        if (!p.alive) return;

        const div =
            document.createElement("div");

        div.className =
            "votePlayer";

        div.innerHTML =
            "🧑‍🚀<br>" +
            p.name;

        div.onclick = () => {

            vote(p.id);

        };

        list.appendChild(div);

    });

    document.getElementById(
        "result"
    ).innerText =
        "투표할 플레이어를 선택하세요.";
}


/* =========================================================
   투표
========================================================= */

let votes = {};


function vote(target) {

    if (host) {

        processVote(
            myId,
            target
        );

    } else {

        sendToHost({
            type: "vote",
            voter: myId,
            target: target
        });
    }

    document.getElementById(
        "result"
    ).innerText =
        "투표 완료!";
}


function skipVote() {

    if (host) {

        processVote(
            myId,
            "skip"
        );

    } else {

        sendToHost({
            type: "vote",
            voter: myId,
            target: "skip"
        });
    }

    document.getElementById(
        "result"
    ).innerText =
        "투표를 건너뛰었습니다.";
}


function processVote(voter, target) {

    votes[voter] = target;

    const alive =
        Object.values(players)
        .filter(p => p.alive);

    if (
        Object.keys(votes).length >=
        alive.length
    ) {

        finishVoting();
    }
}


function finishVoting() {

    const count = {};

    Object.values(votes).forEach(v => {

        if (v === "skip") return;

        count[v] =
            (count[v] || 0) + 1;
    });

    let target = "skip";

    let highest = 0;

    Object.entries(count).forEach(
        ([id, amount]) => {

            if (amount > highest) {

                highest = amount;

                target = id;
            }
        }
    );


    if (target !== "skip") {

        players[target].alive = false;

        broadcast({
            type: "player",
            player: players[target]
        });

        bodies = bodies.filter(
            b => b.playerId !== target
        );
    }


    broadcast({
        type: "voteResult",
        target: target,
        votes: count
    });

    showVoteResult(
        target,
        count
    );


    setTimeout(() => {

        votes = {};

        meetingActive = false;

        document.getElementById(
            "meeting"
        ).style.display = "none";

        checkWin();

    }, 4000);
}


function showVoteResult(target, count) {

    let text = "";

    if (target === "skip") {

        text =
            "⏭️ 아무도 추방되지 않았습니다.";

    } else {

        text =
            "🚀 " +
            players[target].name +
            " 님이 추방되었습니다.";

        if (
            players[target].role ===
            "imposter"
        ) {

            text +=
                "<br>🔴 임포스터였습니다!";

        } else {

            text +=
                "<br>🔵 크루원이었습니다.";
        }
    }

    document.getElementById(
        "result"
    ).innerHTML = text;
}


/* =========================================================
   승리 판정
========================================================= */

function checkWin() {

    const alive =
        Object.values(players)
        .filter(p => p.alive);

    const imposters =
        alive.filter(
            p => p.role === "imposter"
        );

    const crew =
        alive.filter(
            p => p.role !== "imposter"
        );


    if (imposters.length === 0) {

        endGame(false);

        return;
    }


    if (
        imposters.length >=
        crew.length
    ) {

        endGame(true);

        return;
    }


    const done =
        Object.values(players)
        .reduce(
            (sum, p) =>
                sum + p.tasks,
            0
        );

    if (
        done >=
        tasksTotal
    ) {

        endGame(false);
    }
}


/* =========================================================
   게임 종료
========================================================= */

function endGame(impostersWin) {

    broadcast({
        type: "gameOver",
        impostersWin:
            impostersWin
    });

    showGameOver(
        impostersWin
    );
}


function showGameOver(impostersWin) {

    document.getElementById(
        "gameOver"
    ).style.display =
        "flex";

    const title =
        document.getElementById(
            "gameOverTitle"
        );

    const text =
        document.getElementById(
            "gameOverText"
        );


    if (impostersWin) {

        title.innerText =
            "🔴 임포스터 승리!";

        text.innerText =
            "임포스터가 우주선을 장악했습니다.";

    } else {

        title.innerText =
            "🔵 크루원 승리!";

        text.innerText =
            "크루원들이 임포스터를 찾아냈습니다.";
    }
}


/* =========================================================
   채팅
========================================================= */

document.getElementById(
    "chatInput"
).addEventListener(
    "keydown",
    e => {

        if (
            e.key !== "Enter"
        ) return;

        const input =
            e.target;

        const message =
            input.value.trim();

        if (!message) return;

        const data = {

            type: "chat",

            message: message
        };

        addMessage(

        );

        broadcast(
            data
        );

        input.value = "";
    }
);


function addMessage(name, message) {

    const div =
        document.createElement("div");

    div.innerHTML =
        "<b>" +
        escapeHTML(name) +
        ":</b> " +
        escapeHTML(message);

    const messages =
        document.getElementById(
            "messages"
        );

    messages.appendChild(div);

    messages.scrollTop =
        messages.scrollHeight;
}


function escapeHTML(text) {

    return text
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


/* =========================================================
   네트워크
========================================================= */

function sendToHost(data) {

    if (!host) {

        const hostConn =
            connections[roomCode];

        if (
            hostConn &&
            hostConn.open
        ) {

            hostConn.send(data);
        }
    }
}


function broadcast(data, except = null) {

    Object.entries(
        connections
    ).forEach(
        ([id, conn]) => {

            if (
                id === except
            ) return;

            if (
                conn &&
                conn.open
            ) {

                conn.send(data);
            }
        }
    );
}


function broadcastPlayers() {

    broadcast({
        type: "players",
        players:
            Object.values(players)
    });
}

canvas.addEventListener(
    "pointerdown",
    e => {

        if (meetingActive) return;

        const me =
            players[myId];

        if (!me || !me.alive) return;


        /*
           화면 좌표 -> 월드 좌표
        */

        const wx =
            e.clientX -
            W / 2 +
            me.x;

        const wy =
            e.clientY -
            H / 2 +
            me.y;


        const tasks = [
            [-300, -200],
            [330, -200],
            [-300, 190]
        ];


        for (
            let i = 0;
            i < tasks.length;
            i++
        ) {

            const d =
                Math.hypot(
                    wx - tasks[i][0],
                    wy - tasks[i][1]
                );

            if (d < 45) {

                completeTask(i);

                break;
            }
        }
    }
);


function completeTask(index) {

    const me =
        players[myId];

    if (
        me.tasks >=
        tasksTotal
    ) return;


    const taskKey =
        "task_" + index;


    if (
        me[taskKey]
    ) return;


    me[taskKey] =
        true;

    me.tasks++;

    tasksDone++;

    updateTaskUI();


    if (host) {

        broadcast({
            type: "player",
            player: me
        });

        checkWin();

    } else {

        sendToHost({
            type: "player",
            player: me
        });
    }
}


function updateTaskUI() {

    const me =
        players[myId];

    if (!me) return;

    document.getElementById(
        "taskText"
    ).innerText =
        "미션: " +
        me.tasks +
        " / " +
        tasksTotal;
}

========================================================= */

function assignRoles() {

    const ids =
        Object.keys(players);

    if (ids.length < 2) return;

    const random =
        ids[
            Math.floor(
                Math.random() *
                ids.length
            )
        ];

    ids.forEach(id => {

        players[id].role =
            id === random
                ? "imposter"
                : "crew";

    });


    if (players[myId]) {

        myRole =
            players[myId].role;

        updateRoleUI();
    }


    broadcastPlayers();
}
