<script>

/* ======================================================

const canvas =

/* ======================================================

let peer = null;

let myName = "";

let roomCode = "";

let isHost = false;

let connections = {};

let gameStarted = false;

/* ======================================================

======================================================= */

let impostersWanted = 1;

let killCooldown = 20;

let lastKillTime = 0;

let meetingActive = false;

   GAME

const MAP_W = 1600;

const tasks = [

/* ======================================================

const colors = [

/* ======================================================
   CREATE PLAYER
======================================================= */

function createPlayer(
    id,
    name
){

    return {

        id:id,

        name:name,

        x:0,

        y:0,

        color:
            colors[
                Object.keys(players).length %
                colors.length
            ],

        alive:true,

        role:"crew",

        tasks:[],

        kills:0

    };

}


/* ======================================================
   CREATE ROOM
======================================================= */

function createRoom(){

    myName =
        document
        .getElementById("nameInput")
        .value
        .trim();

    if(!myName){

        alert("닉네임을 입력하세요.");

        return;
    }

    isHost = true;

    peer =
        new Peer({
            debug:1
        });


    peer.on(
        "open",
        id=>{

            myId = id;

            roomCode = id;

            document
            .getElementById("status")
            .innerText =
                "방 생성 완료";

            showLobby();

            players[myId] =
                createPlayer(
                    myId,
                    myName
                );

            updateLobby();

        }
    );


    peer.on(
        "connection",
        conn=>{

            setupConnection(conn);

        }
    );


    peer.on(
        "error",
        err=>{

            console.log(err);

            alert(
                "네트워크 오류: "+
                err.type
            );

        }
    );

}


/* ======================================================
   JOIN ROOM
======================================================= */

function joinRoom(){

    myName =
        document
        .getElementById("nameInput")
        .value
        .trim();

    roomCode =
        document
        .getElementById("roomInput")
        .value
        .trim();

    if(!myName){

        alert("닉네임을 입력하세요.");

        return;
    }

    if(!roomCode){

        alert("방 코드를 입력하세요.");

        return;
    }

    isHost = false;

    peer =
        new Peer({
            debug:1
        });


    peer.on(
        "open",
        id=>{

            myId = id;

            const conn =
                peer.connect(
                    roomCode
                );

            setupConnection(conn);

        }
    );


    peer.on(
        "error",
        err=>{

            alert(
                "방 연결 실패: "+
                err.type
            );

        }
    );

}


/* ======================================================
   CONNECTION
======================================================= */

function setupConnection(conn){

    connections[conn.peer] =
        conn;


    conn.on(
        "open",
        ()=>{

            conn.send({

                type:"join",

                player:
                    createPlayer(
                        myId,
                        myName
                    )

            });

        }
    );


    conn.on(
        "data",
        data=>{

            receiveData(
                data,
                conn
            );

        }
    );


    conn.on(
        "close",
        ()=>{

            const id =
                conn.peer;

            if(players[id]){

                addMessage(
                    "SYSTEM",
                    players[id].name+
                    " 님이 나갔습니다."
                );

                delete players[id];

                updateLobby();

            }

        }
    );

}


/* ======================================================
   DATA
======================================================= */

function receiveData(
    data,
    conn
){

    if(!data || !data.type)
        return;


    switch(data.type){

        case "join":

            if(isHost){

                players[
                    data.player.id
                ] =
                    data.player;

                broadcast({

                    type:"players",

                    players:
                        Object.values(players)

                });

                updateLobby();

            }

            break;


        case "players":

            data.players.forEach(
                p=>{
                    players[p.id] = p;
                }
            );

            if(!gameStarted){

                showLobby();

                updateLobby();

            }

            break;


        case "start":

            impostersWanted =
                data.imposters;

            killCooldown =
                data.cooldown;

            Object.values(
                data.players
            ).forEach(
                p=>{
                    players[p.id] = p;
                }
            );

            myName =
                players[myId]?.name ||
                myName;

            startGame();

            break;


        case "move":

            if(players[data.id]){

                players[data.id].x =
                    data.x;

                players[data.id].y =
                    data.y;

            }

            break;


        case "player":

            players[
                data.player.id
            ] =
                data.player;

            updateTaskUI();

            break;


        case "body":

            bodies =
                data.bodies;

            break;


        case "chat":

            addMessage(
                data.name,
                data.message
            );

            break;


        case "meeting":

            startMeeting(
                data.reason
            );

            break;


        case "vote":

            if(isHost){

                processVote(
                    data.voter,
                    data.target
                );

            }

            break;


        case "voteResult":

            finishMeetingDisplay(
                data.target,
                data.ejectedRole
            );

            break;


        case "gameOver":

            showGameOver(
                data.winner
            );

            break;

    }

}


/* ======================================================
   LOBBY
======================================================= */

function showLobby(){

    document
    .getElementById("mainMenu")
    .style.display =
        "none";

    document
    .getElementById("lobby")
    .style.display =
        "block";

    document
    .getElementById("lobbyCode")
    .innerText =
        roomCode.substring(0,8);

    if(!isHost){

        document
        .getElementById("hostSettings")
        .style.display =
            "none";

    }

}


function updateLobby(){

    const box =
        document
        .getElementById("lobbyPlayers");

    box.innerHTML = "";

    Object.values(players)
    .forEach(
        p=>{

            const div =
                document
                .createElement("div");

            div.className =
                "playerLobby";

            div.innerText =
                "🧑‍🚀 "+
                p.name+
                (
                    p.id === myId
                    ? " (나)"
                    : ""
                );

            box.appendChild(div);

        }
    );

}


/* ======================================================
   START ONLINE GAME
======================================================= */

function startOnlineGame(){

    const playerCount =
        Object.keys(players).length;

    impostersWanted =
        Number(
            document
            .getElementById(
                "imposterCount"
            )
            .value
        );

    killCooldown =
        Number(
            document
            .getElementById(
                "killCooldown"
            )
            .value
        );


    if(playerCount < 2){

        alert(
            "최소 2명이 필요합니다."
        );

        return;
    }


    if(impostersWanted >= playerCount){

        alert(
            "임포스터 수가 너무 많습니다."
        );

        return;
    }


    assignRoles();


    broadcast({

        type:"start",

        imposters:
            impostersWanted,

        cooldown:
            killCooldown,

        players:
            players

    });


    startGame();

}


/* ======================================================
   ASSIGN ROLES
======================================================= */

function assignRoles(){

    const ids =
        Object.keys(players);

    ids.forEach(
        id=>{
            players[id].role =
                "crew";
        }
    );


    const shuffled =
        [...ids]
        .sort(
            ()=>Math.random()-0.5
        );


    for(
        let i=0;
        i<impostersWanted;
        i++
    ){

        players[
            shuffled[i]
        ].role =
            "imposter";

    }


    rolesAssigned = true;

}


/* ======================================================
   START GAME
======================================================= */

function startGame(){

    document
    .getElementById("menu")
    .style.display =
        "none";

    document
    .getElementById("game")
    .style.display =
        "block";

    gameStarted = true;


    const me =
        players[myId];

    if(!me) return;


    if(me.role === "imposter"){

        document
        .getElementById("roleText")
        .innerText =
            "🔴 임포스터";

        document
        .getElementById("roleText")
        .style.color =
            "#ff4d4d";

        document
        .getElementById("killBtn")
        .style.display =
            "block";

    }else{

        document
        .getElementById("roleText")
        .innerText =
            me.alive
            ? "🔵 크루원"
            : "👻 유령";

        document
        .getElementById("roleText")
        .style.color =
            "#4fc3ff";

    }


    document
    .getElementById("roomCodeText")
    .innerText =
        roomCode.substring(0,8);


    setupControls();

    updateTaskUI();

    requestAnimationFrame(loop);

}


/* ======================================================
   CONTROLS
======================================================= */

let keys = {};


function setupControls(){

    window.addEventListener(
        "keydown",
        e=>{

            keys[
                e.key.toLowerCase()
            ] = true;

        }
    );


    window.addEventListener(
        "keyup",
        e=>{

            keys[
                e.key.toLowerCase()
            ] = false;

        }
    );


    function hold(
        id,
        key
    ){

        const btn =
            document
            .getElementById(id);

        btn.addEventListener(
            "pointerdown",
            e=>{

                e.preventDefault();

                keys[key] = true;

            }
        );

        btn.addEventListener(
            "pointerup",
            e=>{

                e.preventDefault();

                keys[key] = false;

            }
        );

        btn.addEventListener(
            "pointerleave",
            ()=>{
                keys[key] = false;
            }
        );

    }


    hold("up","w");
    hold("down","s");
    hold("left","a");
    hold("right","d");

}


/* ======================================================
   COLLISION
======================================================= */

function collides(
    x,
    y
){

    const r = 18;


    for(
        const wall of walls
    ){

        if(
            x+r > wall.x &&
            x-r < wall.x+wall.w &&
            y+r > wall.y &&
            y-r < wall.y+wall.h
        ){

            return true;

        }

    }

    return false;

}


/* ======================================================
   MOVEMENT
======================================================= */

let lastMoveSend = 0;


function updateMovement(){

    const me =
        players[myId];

    if(
        !me ||
        !me.alive ||
        meetingActive
    ){

        return;

    }


    let dx = 0;
    let dy = 0;


    if(
        keys["w"] ||
        keys["arrowup"]
    ) dy -= PLAYER_SPEED;

    if(
        keys["s"] ||
        keys["arrowdown"]
    ) dy += PLAYER_SPEED;

    if(
        keys["a"] ||
        keys["arrowleft"]
    ) dx -= PLAYER_SPEED;

    if(
        keys["d"] ||
        keys["arrowright"]
    ) dx += PLAYER_SPEED;


    if(dx && dy){

        dx *= .707;
        dy *= .707;

    }


    const nx =
        me.x + dx;

    const ny =
        me.y + dy;


    if(!collides(nx,me.y))
        me.x = nx;

    if(!collides(me.x,ny))
        me.y = ny;


    me.x =
        Math.max(
            -760,
            Math.min(760,me.x)
        );

    me.y =
        Math.max(
            -460,
            Math.min(460,me.y)
        );


    if(
        performance.now() -
        lastMoveSend >
        50
    ){

        lastMoveSend =
            performance.now();

        sendToHost({

            type:"move",

            id:myId,

            x:me.x,

            y:me.y

        });

    }

}


/* ======================================================
   GAME LOOP
======================================================= */

function loop(){

    if(gameStarted){

        updateMovement();

        draw();

        drawMinimap();

    }

    requestAnimationFrame(loop);

}


/* ======================================================
   DRAW
======================================================= */

function draw(){

    ctx.fillStyle =
        "#11161d";

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    const me =
        players[myId];

    if(!me) return;


    ctx.save();


    ctx.translate(
        W/2-me.x,
        H/2-me.y
    );


    /*
       MAP
    */

    ctx.fillStyle =
        "#252c35";

    ctx.fillRect(
        -800,
        -500,
        MAP_W,
        MAP_H
    );


    /*
       ROOMS
    */

    drawRoom(
        -730,
        -430,
        300,
        250,
        "ELECTRICAL"
    );

    drawRoom(
        -250,
        -430,
        500,
        250,
        "CAFETERIA"
    );

    drawRoom(
        300,
        -430,
        400,
        250,
        "COMMS"
    );

    drawRoom(
        -730,
        180,
        300,
        220,
        "MEDBAY"
    );

    drawRoom(
        -250,
        180,
        500,
        220,
        "REACTOR"
    );

    drawRoom(
        300,
        180,
        400,
        220,
        "ENGINE"
    );


    /*
       WALLS
    */

    walls.forEach(
        wall=>{

            ctx.fillStyle =
                "#151a21";

            ctx.fillRect(
                wall.x,
                wall.y,
                wall.w,
                wall.h
            );

            ctx.strokeStyle =
                "#66717e";

            ctx.lineWidth = 2;

            ctx.strokeRect(
                wall.x,
                wall.y,
                wall.w,
                wall.h
            );

        }
    );


    /*
       TASKS
    */

    tasks.forEach(
        (task,index)=>{

            const done =
                me.tasks.includes(index);

            ctx.fillStyle =
                done
                ? "#27ae60"
                : "#f1c40f";

            ctx.beginPath();

            ctx.arc(
                task.x,
                task.y,
                14,
                0,
                Math.PI*2
            );

            ctx.fill();

            ctx.fillStyle =
                "#111";

            ctx.font =
                "14px Arial";

            ctx.textAlign =
                "center";

            ctx.fillText(
                done ? "✓" : "!",
                task.x,
                task.y+5
            );

        }
    );


    /*
       BODIES
    */

    bodies.forEach(
        body=>{

            ctx.fillStyle =
                "#8e44ad";

            ctx.beginPath();

            ctx.arc(
                body.x,
                body.y,
                17,
                0,
                Math.PI*2
            );

            ctx.fill();

            ctx.fillStyle =
                "white";

            ctx.font =
                "14px Arial";

            ctx.textAlign =
                "center";

            ctx.fillText(
                "☠",
                body.x,
                body.y+5
            );

        }
    );


    /*
       PLAYERS
    */

    Object.values(players)
    .forEach(
        p=>{

            if(!p.alive) return;

            drawPlayer(p);

        }
    );


    /*
       DEAD PLAYERS AS GHOST
    */

    if(!me.alive){

        Object.values(players)
        .forEach(
            p=>{

                if(p.alive) return;

                if(p.id === me.id)
                    return;

                drawGhost(p);

            }
        );

    }


    ctx.restore();

}


/* ======================================================
   ROOM
======================================================= */

function drawRoom(
    x,
    y,
    w,
    h,
    name
){

    ctx.fillStyle =
        "#303944";

    ctx.fillRect(
        x,
        y,
        w,
        h
    );


    ctx.strokeStyle =
        "#7a8591";

    ctx.lineWidth = 4;

    ctx.strokeRect(
        x,
        y,
        w,
        h
    );


    ctx.fillStyle =
        "#aeb7c1";

    ctx.font =
        "17px Arial";

    ctx.textAlign =
        "center";

    ctx.fillText(
        name,
        x+w/2,
        y+27
    );

}


/* ======================================================
   PLAYER
======================================================= */

function drawPlayer(p){

    /*
       body
    */

    ctx.fillStyle =
        p.color;

    ctx.beginPath();

    ctx.arc(
        p.x,
        p.y,
        20,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
       visor
    */

    ctx.fillStyle =
        "#a9eaff";

    ctx.beginPath();

    ctx.ellipse(
        p.x+7,
        p.y-5,
        11,
        7,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
       name
    */

    ctx.fillStyle =
        "white";

    ctx.font =
        "13px Arial";

    ctx.textAlign =
        "center";

    ctx.fillText(
        p.name,
        p.x,
        p.y-30
    );


    if(p.id === myId){

        ctx.strokeStyle =
            "white";

        ctx.lineWidth = 2;

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            25,
            0,
            Math.PI*2
        );

        ctx.stroke();

    }


    /*
       imposters can see other imposters
    */

    const me =
        players[myId];

    if(
        me &&
        me.role === "imposter" &&
        p.role === "imposter" &&
        p.id !== me.id
    ){

        ctx.fillStyle =
            "#ff3333";

        ctx.font =
            "16px Arial";

        ctx.fillText(
            "🔴",
            p.x,
            p.y-45
        );

    }

}


/* ======================================================
   GHOST
======================================================= */

function drawGhost(p){

    ctx.globalAlpha = .35;

    ctx.fillStyle =
        "#bdefff";

    ctx.beginPath();

    ctx.arc(
        p.x,
        p.y,
        20,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.globalAlpha = 1;

}


/* ======================================================
   MINIMAP
======================================================= */

function drawMinimap(){

    const me =
        players[myId];

    if(!me) return;


    miniCtx.clearRect(
        0,
        0,
        150,
        100
    );


    miniCtx.fillStyle =
        "#111";

    miniCtx.fillRect(
        0,
        0,
        150,
        100
    );


    /*
       map
    */

    miniCtx.strokeStyle =
        "#555";

    miniCtx.strokeRect(
        5,
        5,
        140,
        90
    );


    Object.values(players)
    .forEach(
        p=>{

            if(!p.alive) return;

            const x =
                5+
                ((p.x+800)/1600)*140;

            const y =
                5+
                ((p.y+500)/1000)*90;

            miniCtx.fillStyle =
                p.id===myId
                ? "#fff"
                : p.color;

            miniCtx.beginPath();

            miniCtx.arc(
                x,
                y,
                3,
                0,
                Math.PI*2
            );

            miniCtx.fill();

        }
    );

}


/* ======================================================
   KILL
======================================================= */

function killNearest(){

    const me =
        players[myId];

    if(
        !me ||
        !me.alive ||
        me.role !== "imposter"
    ){

        return;

    }


    const now =
        Date.now();

    if(
        now-lastKillTime <
        killCooldown*1000
    ){

        const remain =
            Math.ceil(
                (
                    killCooldown*1000 -
                    (
                        now-lastKillTime
                    )
                )/1000
            );

        addMessage(
            "SYSTEM",
            "킬 쿨타임 "+
            remain+
            "초"
        );

        return;

    }


    let target = null;

    let nearest =
        Infinity;


    Object.values(players)
    .forEach(
        p=>{

            if(
                p.id === me.id ||
                !p.alive
            ){

                return;

            }


            const d =
                Math.hypot(
                    p.x-me.x,
                    p.y-me.y
                );


            if(
                d < nearest &&
                d <= KILL_DISTANCE
            ){

                nearest = d;

                target = p;

            }

        }
    );


    if(!target){

        addMessage(
            "SYSTEM",
            "가까운 플레이어가 없습니다."
        );

        return;

    }


    lastKillTime =
        Date.now();


    sendToHost({

        type:"kill",

        killer:myId,

        target:target.id

    });

}


/* ======================================================
   HOST KILL
======================================================= */

function processKill(
    killerId,
    targetId
){

    if(!isHost) return;


    const killer =
        players[killerId];

    const target =
        players[targetId];


    if(
        !killer ||
        !target ||
        !killer.alive ||
        !target.alive ||
        killer.role !== "imposter"
    ){

        return;

    }


    const distance =
        Math.hypot(
            killer.x-target.x,
            killer.y-target.y
        );


    if(
        distance >
        KILL_DISTANCE+10
    ){

        return;

    }


    target.alive = false;


    bodies.push({

        x:target.x,

        y:target.y,

        playerId:target.id

    });


    broadcast({

        type:"player",

        player:target

    });


    broadcast({

        type:"body",

        bodies:bodies

    });


    addMessage(
        "SYSTEM",
        "누군가 사망했습니다."
    );


    checkWin();

}


/* ======================================================
   REPORT
======================================================= */

function reportBody(){

    const me =
        players[myId];

    if(
        !me ||
        !me.alive
    ){

        return;

    }


    let bodyFound = null;


    for(
        const body of bodies
    ){

        const d =
            Math.hypot(
                body.x-me.x,
                body.y-me.y
            );


        if(
            d <= REPORT_DISTANCE
        ){

            bodyFound =
                body;

            break;

        }

    }


    if(!bodyFound){

        addMessage(
            "SYSTEM",
            "근처에 시체가 없습니다."
        );

        return;

    }


    if(isHost){

        startMeeting(
            "💀 시체가 발견되었습니다!"
        );

    }else{

        sendToHost({

            type:"meeting",

            reason:
                "💀 시체가 발견되었습니다!"

        });

    }

}

/* ======================================================
   MEETING

function startMeeting(reason){

    meetingActive = true;

    meetingVotes = {};

    meetingTimer = 30;


    document
    .getElementById("meeting")
    .style.display =
        "block";


    document
    .getElementById("meetingReason")
    .innerText =
        reason;


    document
    .getElementById("voteResult")
    .innerText =
        "투표할 플레이어를 선택하세요.";


    createVoteCards();


    clearInterval(
        meetingInterval
    );


    meetingInterval =
        setInterval(
            ()=>{

                meetingTimer--;

                document
                .getElementById(
                    "meetingTimer"
                )
                .innerText =
                    meetingTimer;


                if(
                    meetingTimer<=0
                ){

                    clearInterval(
                        meetingInterval
                    );

                    if(isHost){

                        finishVoting();

                    }

                }

            },
            1000
        );

}


/* ======================================================
   VOTE CARDS
======================================================= */

function createVoteCards(){

    const grid =
        document
        .getElementById("voteGrid");

    grid.innerHTML = "";


    Object.values(players)
    .forEach(
        p=>{

            const div =
                document
                .createElement("div");

            div.className =
                "voteCard";


            if(!p.alive){

                div.classList.add(
                    "dead"
                );

                div.innerHTML =
                    "👻<br>"+
                    p.name+
                    "<br><small>사망</small>";

            }else{

                div.innerHTML =
                    "🧑‍🚀<br>"+
                    p.name;

                div.onclick =
                    ()=>{

                        castVote(
                            p.id
                        );

                    };

            }


            grid.appendChild(div);

        }
    );


    const skip =
        document
        .createElement("div");

    skip.className =
        "voteCard";

    skip.innerHTML =
        "⏭️<br>SKIP";

    skip.onclick =
        ()=>{

            castVote("skip");

        };

    grid.appendChild(skip);

}


/* ======================================================
   CAST VOTE
======================================================= */

function castVote(target){

    const me =
        players[myId];

    if(
        !me ||
        !me.alive
    ) return;


    sendToHost({

        type:"vote",

        voter:myId,

        target:target

    });


    document
    .getElementById("voteResult")
    .innerText =
        "투표 완료!";


    /*
       중복 투표 방지
    */

    document
    .querySelectorAll(
        ".voteCard"
    )
    .forEach(
        el=>{
            el.style.pointerEvents =
                "none";
        }
    );

}


/* ======================================================
   PROCESS VOTE
======================================================= */

function processVote(
    voter,
    target
){

    if(!isHost) return;


    if(
        !players[voter] ||
        !players[voter].alive
    ){

        return;

    }


    meetingVotes[voter] =
        target;


    const alivePlayers =
        Object.values(players)
        .filter(
            p=>p.alive
        );


    if(
        Object.keys(meetingVotes)
        .length >=
        alivePlayers.length
    ){

        finishVoting();

    }

}


/* ======================================================
   FINISH VOTING
======================================================= */

function finishVoting(){

    if(!isHost) return;


    const count = {};


    Object.values(
        meetingVotes
    )
    .forEach(
        target=>{

            if(target==="skip")
                return;

            count[target] =
                (count[target]||0)+1;

        }
    );


    let ejected =
        null;

    let highest = 0;


    Object.entries(count)
    .forEach(
        ([id,votes])=>{

            if(
                votes > highest
            ){

                highest = votes;

                ejected = id;

            }

        }
    );


    /*
       동률이면 아무도 추방 안 함
    */

    const top =
        Object.entries(count)
        .filter(
            ([id,v])=>
                v===highest
        );


    if(
        top.length > 1
    ){

        ejected = null;

    }


    let ejectedRole =
        null;


    if(ejected){

        ejectedRole =
            players[ejected].role;

        players[ejected].alive =
            false;


        broadcast({

            type:"player",

            player:
                players[ejected]

        });

    }


    broadcast({

        type:"voteResult",

        target:ejected,

        ejectedRole:ejectedRole

    });


    finishMeetingDisplay(
        ejected,
        ejectedRole
    );


    setTimeout(
        ()=>{

            meetingActive = false;

            document
            .getElementById("meeting")
            .style.display =
                "none";

            bodies = [];

            broadcast({

                type:"body",

                bodies:[]

            });


            meetingVotes = {};

            checkWin();

        },
        4000
    );

}


/* ======================================================
   MEETING RESULT
======================================================= */

function finishMeetingDisplay(
    target,
    role
){

    let text;


    if(!target){

        text =
            "⏭️ 아무도 추방되지 않았습니다.";

    }else{

        const name =
            players[target]?.name ||
            "플레이어";


        text =
            "🚀 "+
            name+
            " 님이 추방되었습니다.";


        if(role==="imposter"){

            text +=
                "<br>🔴 임포스터였습니다!";

        }else{

            text +=
                "<br>🔵 크루원이었습니다.";

        }

    }


    document
    .getElementById("voteResult")
    .innerHTML =
        text;

}


/* ======================================================
   WIN CONDITION
======================================================= */

function checkWin(){

    if(!isHost) return;


    const alive =
        Object.values(players)
        .filter(
            p=>p.alive
        );


    const imp =
        alive.filter(
            p=>p.role==="imposter"
        );


    const crew =
        alive.filter(
            p=>p.role!=="imposter"
        );


    /*
       임포스터 전멸
    */

    if(
        imp.length===0
    ){

        endGame(
            "crew"
        );

        return;

    }


    /*
       임포스터가 크루원과 같아짐
    */

    if(
        imp.length >=
        crew.length
    ){

        endGame(
            "imposter"
        );

        return;

    }


    /*
       전체 미션
    */

    let completed = 0;


    Object.values(players)
    .forEach(
        p=>{
            completed +=
                p.tasks.length;
        }
    );


    if(
        completed >=
        tasks.length
    ){

        endGame(
            "crew"
        );

    }

}

/* ======================================================
   TASK CLICK
======================================================= */

canvas.addEventListener(
    "pointerdown",
    e=>{

        if(
            meetingActive
        ) return;


        const me =
            players[myId];

        if(
            !me ||
            !me.alive
        ) return;


        const wx =
            e.clientX -
            W/2+
            me.x;

        const wy =
            e.clientY -
            H/2+
            me.y;


        tasks.forEach(
            (task,index)=>{

                const d =
                    Math.hypot(
                        wx-task.x,
                        wy-task.y
                    );


                if(
                    d<45 &&
                    !me.tasks.includes(index)
                ){

                    completeTask(
                        index
                    );

                }

            }
        );

    }
);


/* ======================================================
   COMPLETE TASK
======================================================= */

function completeTask(index){

    const me =
        players[myId];

    if(
        !me ||
        !me.alive ||
        me.role==="imposter"
    ) return;


    if(
        me.tasks.includes(index)
    ) return;


    me.tasks.push(index);


    sendToHost({

        type:"player",

        player:me

    });


    if(isHost){

        checkWin();

    }


    updateTaskUI();

}


/* ======================================================
   TASK UI
======================================================= */

function updateTaskUI(){

    const me =
        players[myId];

    if(!me) return;


    const total =
        tasks.length;


    const done =
        me.tasks.length;


    document
    .getElementById("taskText")
    .innerText =
        "내 미션 "+
        done+
        " / "+
        total;


    /*
       전체 미션 진행률
    */

    let completed = 0;


    Object.values(players)
    .forEach(
        p=>{
            completed +=
                p.tasks.length;
        }
    );


    const max =
        tasks.length *
        Math.max(
            1,
            Object.values(players)
            .filter(
                p=>p.role!=="imposter"
            ).length
        );


    const percent =
        Math.min(
            100,
            completed /
            Math.max(
                1,
                max
            ) *
            100
        );


    document
    .getElementById(
        "taskProgress"
    )
    .style.width =
        percent+
        "%";

}


/* ======================================================
   CHAT
======================================================= */

document
.getElementById("chatInput")
.addEventListener(
    "keydown",
    e=>{

        if(
            e.key!=="Enter"
        ) return;


        const input =
            e.target;

        const msg =
            input.value.trim();


        if(!msg) return;


        const data = {

            type:"chat",

            name:
                players[myId]?.name ||
                myName,

            message:msg

        };


        addMessage(
            data.name,
            data.message
        );


        broadcast(
            data
        );


        input.value = "";

    }
);


function addMessage(
    name,
    message
){

    const div =
        document
        .createElement("div");


    div.innerHTML =
        "<b>"+
        escapeHTML(name)+
        ":</b> "+
        escapeHTML(message);


    const box =
        document
        .getElementById(
            "messages"
        );


    box.appendChild(div);

    box.scrollTop =
        box.scrollHeight;

}


function escapeHTML(text){

    return String(text)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


/* ======================================================
   NETWORK SEND
======================================================= */

function sendToHost(data){

    if(isHost){

        receiveData(
            data,
            null
        );

        return;

    }


    /*
       방장 Peer ID = roomCode
    */

    const conn =
        connections[roomCode];


    if(
        conn &&
        conn.open
    ){

        conn.send(data);

    }

}


function broadcast(
    data,
    except=null
){

    Object.entries(
        connections
    )
    .forEach(
        ([id,conn])=>{

            if(
                id===except
            ) return;


            if(
                conn &&
                conn.open
            ){

                conn.send(data);

            }

        }
    );

}


/* ======================================================
   MOVE HOST HANDLING
======================================================= */

const originalReceive =
    receiveData;


/*
   기존 receiveData에 kill/move/player
   처리를 추가하기 위해 별도 처리
*/

    receiveData;


/*
   데이터 후처리
*/

function hostProcess(
    data
){

    if(!isHost)
        return;


    if(
        data.type==="kill"
    ){

        processKill(
            data.killer,
            data.target
        );

    }


    if(
        data.type==="move"
    ){

        if(
            players[data.id]
        ){

            players[data.id].x =
                data.x;

            players[data.id].y =
                data.y;


            broadcast(
                data,
                data.id
            );

        }

    }


    if(
        data.type==="player"
    ){

        if(
            data.player &&
            players[data.player.id]
        ){

            players[data.player.id] =
                data.player;

            broadcast({

                type:"player",

                player:
                    data.player

            });

            updateTaskUI();

            checkWin();

        }

    }


    if(
        data.type==="meeting"
    ){

        startMeeting(
            data.reason
        );

        broadcast(data);

    }

}


/*
   sendToHost 재정의
*/

function sendToHostFinal(data){

    if(isHost){

        hostProcess(data);

    }else{

        const conn =

        if(

        ){

        }

    }

}

function(data,conn){

                );

        if(

                broadcast({
